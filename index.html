<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="lifts-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifts">
<meta name="theme-color" content="#1c2631">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e6e1; --card:#f6f5f2; --ink:#1c2631; --muted:#6a7380; --line:#cfccc4;
  --accent:#c4382c; --accent-ink:#fff; --field:#fff; --good:#2f7d4f;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191f; --card:#1d232b; --ink:#e9e7e2; --muted:#98a1ad; --line:#2f3743;
    --accent:#e0594b; --accent-ink:#15191f; --field:#12161b; --good:#5fb887;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--body);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px}
h1{font:700 34px/1 var(--head);margin:6px 0 14px;letter-spacing:.01em}
h2{font:700 24px/1.1 var(--head);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.nav{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--ink)}
.nav button{background:none;border:0;padding:10px 14px;font:700 18px var(--head);color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=date],.bar select{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.days button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 0;font:700 20px var(--head)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days small{display:block;font:500 12px var(--body);opacity:.7}

.ex{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.last{color:var(--muted);font-size:14px;margin:2px 0 10px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 36px;gap:8px;align-items:center}
.sets .h{font-size:13px;color:var(--muted)}
.sets .n{font:700 20px var(--head);color:var(--muted)}
.cell{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:18px;font-weight:600;text-align:center}
.cell::placeholder{color:var(--muted);opacity:.5;font-weight:500}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:6px}
.row-actions{display:flex;gap:10px;margin-top:10px;align-items:center}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--muted);border:0;padding:9px 4px;margin-left:auto;font-size:14px}
.add{display:flex;gap:8px;margin-top:6px}
.add input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px}
.empty{color:var(--muted);padding:18px 4px}

table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
svg.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
.pr{color:var(--good);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.panel p{margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
[hidden]{display:none!important}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate form,.gate .box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;width:100%;max-width:360px}
.gate h1{margin-top:0}
.gate p{margin:0 0 14px;color:var(--muted);font-size:15px}
.gate .cell{text-align:left;margin-bottom:10px;font-weight:500}
.gate .btn{width:100%;padding:12px}
.gate .msg{min-height:1.4em;margin:10px 0 0;color:var(--accent);font-size:14px}
.gate .btn.link{width:auto;margin:8px 0 0;padding:6px 0;color:var(--muted)}
.week{margin-bottom:16px}
.weekhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.weekhead strong{font:700 19px var(--head)}
.weekhead .btn{padding:4px 12px;font-size:18px}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wk button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 2px 9px;text-align:center;display:flex;flex-direction:column;gap:1px}
.wk .d{font-size:12px;color:var(--muted)}
.wk .w{font:700 18px/1.1 var(--head)}
.wk .s{font-size:12px;font-weight:600;color:var(--muted);min-height:1.2em}
.wk .done .s{color:var(--good)}
.wk .missed .s{color:var(--accent)}
.wk .next{border:2px solid var(--accent);padding:7px 1px 8px}
.wk button[aria-pressed="true"]{box-shadow:inset 0 -4px 0 var(--ink)}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.nav .lock{margin-left:auto;font-size:16px}
.panel .cell{text-align:left;margin-bottom:10px;font-weight:500}
</style>
</head>
<body>
<div class="gate" id="gate" hidden></div>
<div class="wrap" id="wrap" hidden>
  <h1>Lift log</h1>
  <nav class="nav" aria-label="Sections">
    <button data-view="log">Log</button>
    <button data-view="progress">Progress</button>
    <button data-view="data">Backup</button>
    <button class="lock" id="lockbtn">Lock</button>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'liftlog.v1';
const DAYS = [
  {id:'push', name:'Push', wd:'Mon'},
  {id:'pull', name:'Pull', wd:'Tue'},
  {id:'legs', name:'Legs', wd:'Wed'},
  {id:'upper', name:'Upper', wd:'Thu'},
  {id:'lower', name:'Lower', wd:'Fri'}
];
const DEFAULTS = {
  push:['Pec deck','Incline bench','One-hand tricep extension','Overhead tricep extension','Cable lateral raise','Shoulder press machine'],
  pull:['Lat pulldown','T-bar row','One-hand row','Rear delts','Preacher curl machine','Hammer cable curl'],
  legs:[], upper:[], lower:[]
};

/* ---------- Password lock: data is encrypted (AES-GCM) with a key derived from the password ---------- */
const VAULT = 'liftlog.vault', SESS = 'liftlog.sk';
let db = null, cryptoKey = null, vaultSalt = null, saveChain = Promise.resolve();
const te = new TextEncoder(), td = new TextDecoder();

function toB64(buf){
  const a = new Uint8Array(buf); let s = '';
  for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000));
  return btoa(s);
}
function fromB64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function decryptVault(key, v){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, key, fromB64(v.data));
  const s = JSON.parse(td.decode(pt));
  if(!validDb(s)) throw new Error('bad data');
  return s;
}
function validDb(s){ return s && s.exercises && Array.isArray(s.sessions); }
function defaultDb(){ return {exercises: JSON.parse(JSON.stringify(DEFAULTS)), sessions: []}; }
function legacyDb(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(validDb(s)) return s; }catch(e){}
  return null;
}
function save(){
  saveChain = saveChain.then(async()=>{
    if(!cryptoKey || !db) return;
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, cryptoKey, te.encode(JSON.stringify(db)));
    localStorage.setItem(VAULT, JSON.stringify({v:1, salt:toB64(vaultSalt), iv:toB64(iv), data:toB64(ct)}));
  }).catch(()=>toast('Could not save. Your browser may be blocking storage.'));
  return saveChain;
}
async function rememberKey(){
  try{ sessionStorage.setItem(SESS, JSON.stringify(await crypto.subtle.exportKey('jwk', cryptoKey))); }catch(e){}
}
async function resume(){
  try{
    const jwk = sessionStorage.getItem(SESS), v = JSON.parse(localStorage.getItem(VAULT));
    if(!jwk || !v) return false;
    const key = await crypto.subtle.importKey('jwk', JSON.parse(jwk), {name:'AES-GCM'}, true, ['encrypt','decrypt']);
    db = await decryptVault(key, v); cryptoKey = key; vaultSalt = fromB64(v.salt);
    return true;
  }catch(e){ sessionStorage.removeItem(SESS); return false; }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('on'), 2500);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function dayForToday(){
  const wd = new Date().getDay(); // 0 Sun
  return DAYS[(wd>=1 && wd<=5) ? wd-1 : 0].id;
}

const state = {view:'log', day:dayForToday(), date:iso(new Date()), weekStart:null, started:false, pex:null};

function findSession(){ return db.sessions.find(s=>s.date===state.date && s.day===state.day); }
function ensureSession(){
  let s = findSession();
  if(!s){ s = {date:state.date, day:state.day, entries:{}}; db.sessions.push(s); }
  return s;
}
function filled(sets){ return (sets||[]).filter(x=>parseFloat(x.w)>0 && parseFloat(x.r)>0); }
function lastFor(ex){
  const prior = db.sessions
    .filter(s=>s.date<state.date && filled(s.entries[ex]).length)
    .sort((a,b)=>b.date.localeCompare(a.date));
  return prior[0] ? {date:prior[0].date, sets:prior[0].entries[ex]} : null;
}
function setsText(sets){ return filled(sets).map(x=>x.w+'×'+x.r).join(', '); }
function e1rm(w,r){ return w*(1+r/30); }

/* ---------- Schedule: week view and rotation ---------- */
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(s){ const d = parseISO(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); }
function loggedSessions(){ return db.sessions.filter(s=>Object.values(s.entries).some(a=>filled(a).length)); }
function hasData(s){ return Object.values(s.entries).some(a=>a.some(x=>x.w!=='' || x.r!=='')); }
function lastLogged(){
  const l = loggedSessions().sort((a,b)=>a.date.localeCompare(b.date));
  return l[l.length-1] || null;
}
function dayIndex(id){ return DAYS.findIndex(d=>d.id===id); }
function nextUpDay(){
  const l = lastLogged();
  return l ? DAYS[(dayIndex(l.day)+1)%DAYS.length].id : DAYS[0].id;
}
/* Assigns the rotation to each weekday from today on, continuing after the last workout logged. */
function project(endISO){
  const last = lastLogged(), t = iso(new Date()), map = {};
  let i = last ? (dayIndex(last.day)+1)%DAYS.length : 0;
  let d = (last && last.date>=t) ? addDays(last.date,1) : t;
  while(d<=endISO){
    const wd = parseISO(d).getDay();
    if(wd>=1 && wd<=5){ map[d] = DAYS[i].id; i = (i+1)%DAYS.length; }
    d = addDays(d,1);
  }
  return map;
}
function weekHTML(){
  const t = iso(new Date()), start = state.weekStart, end = addDays(start,4);
  const proj = project(end);
  const nextDate = Object.keys(project(addDays(t,10))).sort()[0];
  const logs = loggedSessions(), first = logs.map(s=>s.date).sort()[0];
  let cells = '';
  for(let k=0;k<5;k++){
    const dt = addDays(start,k), plan = DAYS[k];
    const here = logs.filter(s=>s.date===dt);
    let cls = '', label = '', day = plan.id, name = plan.name;
    if(here.length){
      cls = 'done'; label = '✓ Done'; day = here[0].day;
      name = here.map(s=>DAYS[dayIndex(s.day)].name).join(' + ');
    }else if(dt<t){
      if(first && dt>=first){ cls = 'missed'; label = 'Missed'; }
    }else if(proj[dt]){
      day = proj[dt]; name = DAYS[dayIndex(day)].name;
      if(dt===nextDate){ cls = 'next'; label = 'Next up'; } else label = 'Planned';
    }
    cells += `<button data-wk="${dt}|${day}" class="${cls}" aria-pressed="${dt===state.date}">
      <span class="d">${plan.wd} ${parseISO(dt).getDate()}</span><span class="w">${esc(name)}</span><span class="s">${label}</span></button>`;
  }
  return `<div class="week"><div class="weekhead">
    <button class="btn ghost" data-wkshift="-1" aria-label="Previous week">‹</button>
    <strong>Week of ${esc(fmt(start))}</strong>
    <button class="btn ghost" data-wkshift="1" aria-label="Next week">›</button>
    <button class="btn link" data-wknow="1">This week</button></div>
    <div class="wk">${cells}</div></div>`;
}

/* ---------- Log view ---------- */
function renderLog(){
  const list = db.exercises[state.day] || [];
  const ses = findSession();
  let h = `<div class="bar"><label>Date <input type="date" id="date" value="${state.date}"></label></div>`;
  h += weekHTML();
  h += '<div class="days" role="group" aria-label="Workout day">' + DAYS.map(d =>
    `<button data-day="${d.id}" aria-pressed="${d.id===state.day}">${d.name}<small>${d.wd}</small></button>`).join('') + '</div>';

  if(!list.length) h += '<p class="empty">No exercises on this day yet. Add the first one below.</p>';

  list.forEach((ex,i)=>{
    const cur = (ses && ses.entries[ex]) || [];
    const last = lastFor(ex);
    const n = Math.max(3, cur.length);
    h += `<section class="ex"><header><h2>${esc(ex)}</h2></header>`;
    h += `<p class="last">${last ? 'Last ('+fmt(last.date)+'): '+esc(setsText(last.sets)) : 'No earlier sessions logged'}</p>`;
    h += '<div class="sets"><span class="h">Set</span><span class="h">Weight (lb)</span><span class="h">Reps</span><span></span>';
    for(let j=0;j<n;j++){
      const v = cur[j] || {w:'',r:''};
      const lp = last && last.sets[j] ? last.sets[j] : {w:'',r:''};
      h += `<span class="n">${j+1}</span>
        <input class="cell" inputmode="decimal" data-e="${i}" data-s="${j}" data-f="w" value="${esc(v.w)}" placeholder="${esc(lp.w)}" aria-label="Set ${j+1} weight">
        <input class="cell" inputmode="numeric" data-e="${i}" data-s="${j}" data-f="r" value="${esc(v.r)}" placeholder="${esc(lp.r)}" aria-label="Set ${j+1} reps">
        <button class="x" data-act="rmset" data-e="${i}" data-s="${j}" aria-label="Remove set ${j+1}">×</button>`;
    }
    h += `</div><div class="row-actions"><button class="btn ghost" data-act="addset" data-e="${i}">Add set</button>
      <button class="btn link" data-act="rmex" data-e="${i}">Remove exercise</button></div></section>`;
  });

  h += `<form class="add" id="addex"><input id="newex" placeholder="Add an exercise to ${DAYS.find(d=>d.id===state.day).name}" aria-label="New exercise name"><button class="btn" type="submit">Add</button></form>`;
  app.innerHTML = h;
}

/* ---------- Progress view ---------- */
function allExercises(){
  const set = new Set();
  Object.values(db.exercises).forEach(l=>l.forEach(x=>set.add(x)));
  db.sessions.forEach(s=>Object.keys(s.entries).forEach(x=>{ if(filled(s.entries[x]).length) set.add(x); }));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function chart(pts){
  if(pts.length<2) return '<p class="empty">Log this lift in two sessions to see a trend.</p>';
  const W=600,H=220,p=34;
  const vals = pts.map(q=>q.e);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(lo===hi){lo-=5;hi+=5}
  const x = i=>p+i*(W-2*p)/(pts.length-1);
  const y = v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
  const line = pts.map((q,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(q.e).toFixed(1)).join(' ');
  const dots = pts.map((q,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(q.e).toFixed(1)}" r="4" fill="var(--accent)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max over time">
    <text x="${p}" y="18" fill="var(--muted)" font-size="12">Estimated 1-rep max (lb)</text>
    <text x="6" y="${y(hi)+4}" fill="var(--muted)" font-size="12">${Math.round(hi)}</text>
    <text x="6" y="${y(lo)+4}" fill="var(--muted)" font-size="12">${Math.round(lo)}</text>
    <line x1="${p}" x2="${W-p}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>${dots}
    <text x="${p}" y="${H-8}" fill="var(--muted)" font-size="12">${esc(fmt(pts[0].date))}</text>
    <text x="${W-p}" y="${H-8}" fill="var(--muted)" font-size="12" text-anchor="end">${esc(fmt(pts[pts.length-1].date))}</text>
  </svg>`;
}
function renderProgress(){
  const exs = allExercises();
  if(!exs.length){ app.innerHTML = '<p class="empty">Nothing to show yet. Log a workout first.</p>'; return; }
  if(!state.pex || !exs.includes(state.pex)) state.pex = exs[0];
  const pts = db.sessions
    .map(s=>({date:s.date, sets:filled(s.entries[state.pex])}))
    .filter(q=>q.sets.length)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(q=>{
      const top = q.sets.reduce((m,s)=>{const w=parseFloat(s.w), r=parseFloat(s.r); return (w>m.w||(w===m.w&&r>m.r))?{w,r}:m;},{w:0,r:0});
      const e = Math.max(...q.sets.map(s=>e1rm(parseFloat(s.w),parseFloat(s.r))));
      return {date:q.date, sets:q.sets, top, e};
    });
  let h = `<div class="bar"><select id="pex" aria-label="Exercise">${exs.map(x=>`<option${x===state.pex?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  if(!pts.length){ h += '<p class="empty">No sets logged for this exercise yet.</p>'; app.innerHTML = h; return; }
  const bestW = Math.max(...pts.map(q=>q.top.w));
  h += chart(pts);
  h += '<table><thead><tr><th>Date</th><th>Sets</th><th>Top set</th></tr></thead><tbody>' +
    pts.slice().reverse().map(q=>`<tr><td>${esc(fmt(q.date))}</td><td>${esc(setsText(q.sets))}</td>
      <td>${q.top.w}×${q.top.r}${q.top.w===bestW?' <span class="pr">best</span>':''}</td></tr>`).join('') + '</tbody></table>';
  app.innerHTML = h;
}

/* ---------- Backup view ---------- */
function renderData(){
  const n = db.sessions.filter(s=>Object.values(s.entries).some(filled=>filled.some(x=>parseFloat(x.w)>0))).length;
  app.innerHTML = `
    <div class="panel"><p>Your lifts are stored in this browser on this device. Download a backup now and then, and use it to move your log to another phone or computer.</p>
    <p>${n} workout${n===1?'':'s'} logged.</p>
    <button class="btn" data-act="export">Download backup</button></div>
    <div class="panel"><p>Restore from a backup file. This replaces what is on this device.</p>
    <input type="file" id="import" accept="application/json,.json"></div>
    <div class="panel"><p>Change your password. Your log is re-encrypted with the new one.</p>
    <input class="cell" type="password" id="newpw" autocomplete="new-password" placeholder="New password" aria-label="New password">
    <button class="btn" data-act="changepw">Change password</button></div>
    <div class="panel"><p>Backup files are not encrypted. Keep them somewhere private.</p></div>`;
}

/* ---------- Wiring ---------- */
const app = document.getElementById('app');
function render(){
  document.querySelectorAll('.nav button').forEach(b=>{
    if(b.dataset.view===state.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  ({log:renderLog, progress:renderProgress, data:renderData})[state.view]();
}

document.querySelector('.nav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-view]'); if(!b) return;
  state.view = b.dataset.view; render();
});

app.addEventListener('input', e=>{
  const c = e.target.closest('.cell'); if(!c) return;
  const name = db.exercises[state.day][+c.dataset.e];
  const ses = ensureSession();
  const arr = ses.entries[name] = ses.entries[name] || [];
  const j = +c.dataset.s;
  while(arr.length<=j) arr.push({w:'',r:''});
  arr[j][c.dataset.f] = c.value.trim();
  save();
});

app.addEventListener('change', e=>{
  if(e.target.id==='date' && e.target.value){ state.date = e.target.value; state.weekStart = mondayOf(state.date); render(); }
  if(e.target.id==='pex'){ state.pex = e.target.value; render(); }
  if(e.target.id==='import'){
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const s = JSON.parse(r.result);
        if(!s.exercises || !Array.isArray(s.sessions)) throw new Error('bad');
        db = s; save(); toast('Backup restored'); render();
      }catch(err){ toast('That file is not a lift log backup.'); }
    };
    r.readAsText(f);
  }
});

app.addEventListener('submit', e=>{
  if(e.target.id!=='addex') return;
  e.preventDefault();
  const v = document.getElementById('newex').value.trim();
  if(!v) return;
  const list = db.exercises[state.day];
  if(list.some(x=>x.toLowerCase()===v.toLowerCase())){ toast('That exercise is already on this day.'); return; }
  list.push(v); save(); render();
});

app.addEventListener('click', async e=>{
  const wk = e.target.closest('button[data-wk]');
  if(wk){ const [dt,dy] = wk.dataset.wk.split('|'); state.date = dt; state.day = dy; render(); return; }
  const sh = e.target.closest('button[data-wkshift]');
  if(sh){ state.weekStart = addDays(state.weekStart, 7*(+sh.dataset.wkshift)); render(); return; }
  if(e.target.closest('button[data-wknow]')){ state.weekStart = mondayOf(iso(new Date())); render(); return; }
  const dayBtn = e.target.closest('button[data-day]');
  if(dayBtn){ state.day = dayBtn.dataset.day; render(); return; }
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='changepw'){
    const pw = document.getElementById('newpw').value;
    if(!pw){ toast('Enter a new password.'); return; }
    b.disabled = true;
    try{
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pw, salt);
      vaultSalt = salt; cryptoKey = key;
      await save(); await rememberKey();
      document.getElementById('newpw').value = '';
      toast('Password changed');
    }catch(err){ toast('Could not change the password.'); }
    b.disabled = false;
    return;
  }
  if(act==='export'){
    const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'lift-log-backup-'+iso(new Date())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  const i = +b.dataset.e, name = db.exercises[state.day][i];
  if(act==='addset'){
    const ses = ensureSession();
    const arr = ses.entries[name] = ses.entries[name] || [];
    while(arr.length<3) arr.push({w:'',r:''});
    arr.push({w:'',r:''}); save(); render();
  }
  if(act==='rmset'){
    const ses = ensureSession();
    const arr = ses.entries[name] = ses.entries[name] || [];
    while(arr.length<3) arr.push({w:'',r:''});
    arr.splice(+b.dataset.s,1); save(); render();
  }
  if(act==='rmex'){
    if(confirm('Remove "'+name+'" from this day? Past sets stay in your history.')){
      db.exercises[state.day].splice(i,1); save(); render();
    }
  }
});

/* ---------- Lock screen ---------- */
const gate = document.getElementById('gate'), wrap = document.getElementById('wrap');

function showApp(){
  if(!state.started){
    state.started = true;
    const today = iso(new Date());
    const inProgress = db.sessions.filter(s=>s.date===today && hasData(s));
    state.date = today;
    state.weekStart = mondayOf(today);
    state.day = inProgress.length ? inProgress[inProgress.length-1].day : nextUpDay();
  }
  gate.hidden = true; wrap.hidden = false; render();
}

function showGate(){
  wrap.hidden = true; gate.hidden = false;
  const hasVault = !!localStorage.getItem(VAULT);
  if(hasVault){
    gate.innerHTML = `<form id="unlock"><h1>Lift log</h1>
      <input class="sr" type="text" name="username" value="Lift log" autocomplete="username" readonly tabindex="-1" aria-hidden="true">
      <p>Enter your password to open your log.</p>
      <input class="cell" type="password" name="pw" autocomplete="current-password" aria-label="Password" required>
      <button class="btn" type="submit">Unlock</button>
      <p class="msg" role="alert"></p>
      <button class="btn link" type="button" data-gate="forgot">Forgot password</button></form>`;
  }else{
    gate.innerHTML = `<form id="setup"><h1>Lift log</h1>
      <input class="sr" type="text" name="username" value="Lift log" autocomplete="username" readonly tabindex="-1" aria-hidden="true">
      <p>Choose a password. It locks your log on this device${legacyDb() ? ', including the workouts you have already saved' : ''}.</p>
      <p>If you forget it, the log can’t be recovered. Download a backup from the Backup tab once you are in.</p>
      <input class="cell" type="password" name="pw" autocomplete="new-password" placeholder="Password" aria-label="Password" required>
      <button class="btn" type="submit">Set password</button>
      <p class="msg" role="alert"></p></form>`;
  }
  const f = gate.querySelector('input[type=password]'); if(f) f.focus();
}

gate.addEventListener('submit', async e=>{
  e.preventDefault();
  const f = e.target, msg = gate.querySelector('.msg'), btn = f.querySelector('button[type=submit]');
  const pw = f.pw.value;
  btn.disabled = true; msg.textContent = 'Working…';
  try{
    if(f.id==='unlock'){
      const v = JSON.parse(localStorage.getItem(VAULT));
      const salt = fromB64(v.salt);
      const key = await deriveKey(pw, salt);
      let data;
      try{ data = await decryptVault(key, v); }
      catch(err){ msg.textContent = 'Wrong password.'; btn.disabled = false; f.pw.select(); return; }
      db = data; cryptoKey = key; vaultSalt = salt;
    }else{
      if(!pw){ msg.textContent = 'Enter a password.'; btn.disabled = false; return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pw, salt);
      vaultSalt = salt; cryptoKey = key;
      db = legacyDb() || defaultDb();
      await save();
      if(!localStorage.getItem(VAULT)) throw new Error('not saved');
      localStorage.removeItem(KEY);
    }
    await rememberKey();
    showApp();
  }catch(err){
    msg.textContent = 'Something went wrong. Reload and try again.';
    btn.disabled = false;
  }
});

gate.addEventListener('click', e=>{
  if(e.target.dataset.gate==='forgot'){
    if(confirm('This erases the log stored on this device so you can set a new password. You can restore a backup file afterwards. Continue?')){
      localStorage.removeItem(VAULT); sessionStorage.removeItem(SESS); showGate();
    }
  }
});

document.getElementById('lockbtn').addEventListener('click', async ()=>{
  await saveChain;
  sessionStorage.removeItem(SESS);
  db = null; cryptoKey = null; vaultSalt = null;
  showGate();
});

async function boot(){
  if(!window.crypto || !crypto.subtle){
    wrap.hidden = true; gate.hidden = false;
    gate.innerHTML = '<div class="box"><h1>Lift log</h1><p>The password lock needs a secure connection. Open this page over https.</p></div>';
    return;
  }
  if(await resume()) showApp(); else showGate();
}
boot();
</script>
</body>
</html>
